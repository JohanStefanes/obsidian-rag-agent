[project]
name = "obsidian-rag-agent"
version = "0.1.0"
description = "Fully local RAG + auto-tagging + VA journal drafter for an Obsidian vault"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ollama>=0.4.0",
    "sqlite-vec>=0.1.6",
    "python-frontmatter>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
web = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]
app = [
    "pywebview>=5.0",
]

[project.scripts]
vaultrag = "vaultrag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vaultrag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
